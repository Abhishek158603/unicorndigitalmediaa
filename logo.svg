<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="40%" stop-color="#040714" />
      <stop offset="100%" stop-color="#021024" />
    </linearGradient>

    <!-- Outer Ring 24K Gold Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Royal Cyber Gradient (Purple to Cyan) -->
    <linearGradient id="cyberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Unicorn Majestic Body Gradient -->
    <linearGradient id="unicornBodyGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Unicorn Purple Shading Gradient -->
    <linearGradient id="unicornShadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Dynamic Mane Wing Gradient -->
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glowing Horn Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="90%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="royalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield (Luxury Octagonal Crest) -->
  <rect x="20" y="20" width="460" height="460" rx="90" fill="url(#luxuryBg)" stroke="url(#goldRing)" stroke-width="4" />
  
  <!-- Inner Ambient Neon Glows -->
  <circle cx="250" cy="220" r="160" fill="#7c3aed" opacity="0.18" filter="url(#superGlow)" />
  <circle cx="340" cy="160" r="100" fill="#06b6d4" opacity="0.15" filter="url(#superGlow)" />
  <circle cx="160" cy="320" r="110" fill="#ec4899" opacity="0.12" filter="url(#superGlow)" />

  <!-- Inner Cyber Hexagonal Border Line -->
  <rect x="40" y="40" width="420" height="420" rx="76" fill="none" stroke="url(#cyberRing)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-linecap="round" />
  <path d="M 440 90 L 440 60 L 410 60" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-linecap="round" />
  <path d="M 60 410 L 60 440 L 90 440" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-linecap="round" />
  <path d="M 440 410 L 440 440 L 410 440" fill="none" stroke="url(#goldRing)" stroke-width="3" stroke-linecap="round" />

  <!-- Digital Media Waves & Audio OBD Beams behind Unicorn -->
  <g opacity="0.45">
    <circle cx="250" cy="240" r="180" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="250" cy="240" r="140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="70" y1="240" x2="130" y2="240" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <line x1="370" y1="240" x2="430" y2="240" stroke="#ec4899" stroke-width="2" stroke-linecap="round" />
    <line x1="250" y1="60" x2="250" y2="100" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= UNICORN CREST EMBLEM ================= -->
  
  <!-- Flowing Royal Mane (3-Tier Layered Wings) -->
  <!-- Layer 3: Backmost Cyan/Blue Wing -->
  <path d="M 120 320 C 110 260, 130 200, 180 160 C 165 190, 175 220, 195 240 C 170 245, 150 270, 145 305 C 135 320, 130 340, 140 360 C 128 350, 122 335, 120 320 Z" 
        fill="url(#maneGrad)" opacity="0.65" filter="url(#royalGlow)" />

  <!-- Layer 2: Mid Violet/Pink Wing -->
  <path d="M 145 285 C 135 225, 160 170, 215 130 C 200 160, 210 195, 235 210 C 215 215, 195 240, 190 270 C 180 290, 185 320, 205 340 C 180 330, 165 315, 145 285 Z" 
        fill="url(#maneGrad)" opacity="0.9" />

  <!-- Layer 1: Front Radiant Crest Mane -->
  <path d="M 175 240 C 170 195, 195 150, 245 110 C 235 140, 250 165, 275 175 C 255 180, 240 205, 238 230 C 230 255, 240 280, 260 295 C 235 285, 215 270, 175 240 Z" 
        fill="url(#maneGrad)" />

  <!-- Unicorn Neck (Powerful Muscular Arch) -->
  <path d="M 180 390 C 170 330, 190 270, 230 230 C 248 212, 262 190, 266 165 L 305 178 C 315 200, 318 228, 310 252 C 300 278, 290 305, 292 335 C 294 362, 315 390, 345 410 L 290 422 C 240 415, 205 408, 180 390 Z" 
        fill="url(#unicornShadeGrad)" />

  <!-- Unicorn Jaw, Head & Cheeks (Precision Geometric Silhouette) -->
  <path d="M 266 165 L 312 176 C 338 185, 368 205, 388 230 C 402 248, 404 262, 382 272 C 362 280, 335 275, 315 260 C 300 250, 290 238, 280 218 L 266 165 Z" 
        fill="url(#unicornBodyGrad)" />

  <!-- Unicorn Muzzle / Nose Bridge -->
  <path d="M 370 254 L 420 268 C 427 270, 428 276, 423 280 C 413 289, 395 296, 376 294 C 354 292, 332 282, 315 268 L 370 254 Z" 
        fill="#f8fafc" />

  <!-- Unicorn Nostril / Breathing Digital Power -->
  <ellipse cx="406" cy="275" rx="3.5" ry="2" fill="#64748b" transform="rotate(-10 406 275)" />

  <!-- Unicorn Eye: Cyan Glowing Cyber Optic -->
  <g filter="url(#royalGlow)">
    <polygon points="345,225 365,232 352,240 338,233" fill="#020617" />
    <ellipse cx="351" cy="232" rx="6" ry="3.5" fill="#06b6d4" />
    <circle cx="353" cy="231" r="2" fill="#ffffff" />
  </g>

  <!-- Unicorn Ear (Sharp, Alert Royal Ear) -->
  <path d="M 264 168 L 274 115 C 276 112, 280 112, 282 116 L 296 156 L 285 168 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M 273 158 L 278 126 L 288 152 Z" fill="#c084fc" opacity="0.8" />

  <!-- ================= 24K GOLDEN GLOWING SPIRAL HORN ================= -->
  <!-- Majestic Horn Polygon radiating forward -->
  <polygon points="295,152 445,62 315,138" fill="url(#hornGrad)" filter="url(#royalGlow)" />
  
  <!-- Horn Spiraled 3D Ribs / Energy Wave Bands -->
  <line x1="312" y1="144" x2="322" y2="136" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
  <line x1="334" y1="126" x2="346" y2="118" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <line x1="360" y1="108" x2="374" y2="100" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
  <line x1="388" y1="90" x2="402" y2="82" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="416" y1="74" x2="428" y2="68" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />

  <!-- Radiant Starburst Sparkle at Horn Tip -->
  <g transform="translate(445, 62)" filter="url(#superGlow)">
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
    <line x1="-14" y1="14" x2="14" y2="-14" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Network Data Nodes (Mass SMS/Voice Broadcast & Media Constellation) -->
  <g opacity="0.85">
    <circle cx="210" cy="350" r="4" fill="#06b6d4" />
    <circle cx="245" cy="330" r="3" fill="#a855f7" />
    <circle cx="270" cy="360" r="5" fill="#f59e0b" filter="url(#royalGlow)" />
    <line x1="210" y1="350" x2="245" y2="330" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
    <line x1="245" y1="330" x2="270" y2="360" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Lower Banner Bar with Brand Inscription -->
  <g transform="translate(250, 442)">
    <!-- Pill container -->
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#030712" stroke="url(#goldRing)" stroke-width="1.5" />
    <!-- Golden Text -->
    <text x="0" y="4" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="3.5" fill="url(#goldRing)">
      UNICORN DIGITAL MEDIAA
    </text>
  </g>

</svg>
